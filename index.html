<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HostelBuddy — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="login.css" />
</head>
<body>

  <!-- Decorative background shapes -->
  <div class="bg-shape bg-shape--1" aria-hidden="true"></div>
  <div class="bg-shape bg-shape--2" aria-hidden="true"></div>

  <main class="login-page">

    <!-- Login card -->
    <div class="login-card">

      <!-- Logo & branding -->
      <div class="brand">
        <div class="brand__icon">
          <!-- House / building icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
               stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" />
          </svg>
        </div>
        <h1 class="brand__title">HostelBuddy</h1>
        <p class="brand__subtitle">Hostel Management System</p>
      </div>

      <!-- Role badges (decorative) -->
      <div class="role-badges">
        <span class="badge badge--student">Student</span>
        <span class="badge badge--admin">Admin</span>
        <span class="badge badge--super-admin">Super Admin</span>
      </div>

      <!-- Login form -->
      <form id="loginForm" class="login-form" novalidate>

        <!-- Error summary (hidden by default) -->
        <div id="errorSummary" class="error-summary" role="alert" aria-live="polite" hidden>
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
               stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
          <span id="errorText"></span>
        </div>

        <!-- Email field -->
        <div class="form-group">
          <label for="email" class="form-label">Email address</label>
          <div class="input-wrapper">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
              <polyline points="22,6 12,13 2,6" />
            </svg>
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              placeholder="you@example.com"
              autocomplete="email"
              required
            />
          </div>
          <span class="form-error" id="emailError" role="alert"></span>
        </div>

        <!-- Password field -->
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            <input
              type="password"
              id="password"
              name="password"
              class="form-input form-input--password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />
            <button
              type="button"
              id="togglePassword"
              class="password-toggle"
              aria-label="Show password"
            >
              <!-- Eye open -->
              <svg class="icon-eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                   viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <!-- Eye closed (hidden by default) -->
              <svg class="icon-eye-closed" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                   viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" hidden>
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            </button>
          </div>
          <span class="form-error" id="passwordError" role="alert"></span>
        </div>

        <!-- Remember me + Forgot password -->
        <div class="form-row">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe" name="rememberMe" />
            <span class="checkbox-custom"></span>
            Remember me
          </label>
          <a href="#" class="link link--muted">Forgot password?</a>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn--primary" id="submitBtn">
          <span class="btn__text">Login</span>
          <span class="btn__spinner" hidden>
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <path d="M12 2a10 10 0 0 1 10 10" />
            </svg>
          </span>
        </button>
      </form>

      <!-- Register link -->
      <p class="register-text">
        Don't have an account?
        <a href="#" class="link link--primary">Register</a>
      </p>

    </div><!-- /.login-card -->

  </main>

  <script src="login.js"></script>
</body>
</html>
